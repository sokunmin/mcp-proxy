services:
  # Default service - Development mode (configurable via .env)
  mcp-proxy:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/app
    environment:
      - TZ=${TZ}
      - TRANSPORT=${TRANSPORT}
      - HOST=${HOST}
      - PORT=${PORT}

  # Production mode (configurable via .env)
  mcp-proxy-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/app
    environment:
      - TZ=${TZ}
      - TRANSPORT=${TRANSPORT}
      - HOST=${HOST}
      - PORT=${PORT}